name: Repair review count imports
on:
  push:
    paths:
      - '.github/workflows/patch-review-count-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repair ViewModel and Screen references
        run: |
          python3 -c 'from pathlib import Path; nl=chr(10); p=Path("app/src/main/java/com/flashlearn/app/ui/review/ReviewViewModel.kt"); s=p.read_text(); s=s.replace("import com.flashlearn.domain.usecase.ReviewCandidate"+nl, "import com.flashlearn.domain.usecase.ReviewCandidate"+nl+"import com.flashlearn.domain.usecase.CountReviewQueueUseCase"+nl, 1); s=s.replace("    val maximumReviewCards: Int = SettingsKeys.DEFAULT_MAXIMUM_REVIEW_CARDS,"+nl, "    val maximumReviewCards: Int = SettingsKeys.DEFAULT_MAXIMUM_REVIEW_CARDS,"+nl+"    val availableReviewCount: Int = 0,"+nl, 1); s=s.replace("    private val categoryRepository: CategoryRepository,"+nl+"    private val generateQuizQuestion:", "    private val categoryRepository: CategoryRepository,"+nl+"    private val countReviewQueue: CountReviewQueueUseCase,"+nl+"    private val generateQuizQuestion:", 1); p.write_text(s)'
          python3 -c 'from pathlib import Path; nl=chr(10); p=Path("app/src/main/java/com/flashlearn/app/ui/review/ReviewScreen.kt"); s=p.read_text(); s=s.replace("import androidx.compose.foundation.rememberScrollState"+nl, "import androidx.compose.foundation.rememberScrollState"+nl+"import androidx.compose.foundation.horizontalScroll"+nl, 1); p.write_text(s)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-review-count-v2.yml
          git add app/src/main/java/com/flashlearn/app/ui/review/ReviewViewModel.kt app/src/main/java/com/flashlearn/app/ui/review/ReviewScreen.kt
          git commit -m 'Repair review count references'
          git push
