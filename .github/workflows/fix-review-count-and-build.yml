          s = s.replace('Text("${state.maximumReviewCards} کلمه آماده مرور", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)', 'Text("${minOf(state.maximumReviewCards, state.availableReviewCount)} کلمه آماده مرور از ${state.availableReviewCount} کلمه فیلتر شده", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)', 1)
          s = s.replace('Button(onClick = vm::startNewSession, modifier = Modifier.fillMaxWidth().height(58.dp)', 'Button(enabled = state.availableReviewCount > 0, onClick = vm::startNewSession, modifier = Modifier.fillMaxWidth().height(58.dp)', 1)
          screen.write_text(s, encoding='utf-8')
          PY
