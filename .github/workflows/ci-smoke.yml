name: FlashLearn CI Smoke Test

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke
        run: |
          echo "GitHub Actions runner is executing."
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
