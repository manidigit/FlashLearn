name: FlashLearn Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FL_VERSION_NAME: "5.78"
  FL_VERSION_CODE: "78"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Compile and assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK version
        run: test "$(apkanalyzer manifest version-code app/build/outputs/apk/debug/app-debug.apk)" = "${FL_VERSION_CODE}"
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Verify multiple-meaning merge implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'val newTranslations' domain/src/main/java/com/flashlearn/domain/usecase/ImportParsedEntryUseCase.kt
          grep -q 'computeCanonicalKey(it) !in existingKeys' domain/src/main/java/com/flashlearn/domain/usecase/ImportParsedEntryUseCase.kt
          grep -q 'val targets: List<Content>' app/src/main/java/com/flashlearn/app/ui/library/LibraryViewModel.kt
          grep -q 'cc.filter{it.languageCode==targetLanguage}' app/src/main/java/com/flashlearn/app/ui/library/LibraryViewModel.kt
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlashLearn_v${FL_VERSION_NAME}_DEBUG.apk"
          git archive --format=zip --output="dist/FlashLearn_v${FL_VERSION_NAME}_SOURCE.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-v5.78-debug-apk
          path: dist/FlashLearn_v5.78_DEBUG.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-v5.78-source
          path: dist/FlashLearn_v5.78_SOURCE.zip
          if-no-files-found: error
