name: FlashLearn Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FL_VERSION_NAME: "5.73"
  FL_VERSION_CODE: "73"

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore stable CI debug keystore
        id: ci-debug-keystore-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: flashlearn-ci-debug-keystore-v1
      - name: Create stable CI debug keystore
        if: steps.ci-debug-keystore-restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Save stable CI debug keystore
        if: steps.ci-debug-keystore-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: flashlearn-ci-debug-keystore-v1
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlashLearn_v${FL_VERSION_NAME}_DEBUG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-debug-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_DEBUG.apk
          if-no-files-found: error
      - name: Stage exact source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/FlashLearn_v${FL_VERSION_NAME}_SOURCE.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-source
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_SOURCE.zip
          if-no-files-found: error

  instrumentation-tests:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore stable CI debug keystore
        id: ci-debug-keystore-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: flashlearn-ci-debug-keystore-v1
          fail-on-cache-miss: true
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot"
          disable-animations: true
          force-avd-creation: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            rm -f app/build/outputs/apk/debug/app-debug.apk
            cp app/build.gradle.kts "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}"
            trap 'cp "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}" app/build.gradle.kts' EXIT
            sed -i 's/versionCode = 73/versionCode = 72/; s/versionName = "5.73"/versionName = "5.72"/' app/build.gradle.kts
            gradle --no-daemon :app:assembleDebug
            adb install app/build/outputs/apk/debug/app-debug.apk
            test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "72"
            sed -i 's/versionCode = 72/versionCode = 73/; s/versionName = "5.72"/versionName = "5.73"/' app/build.gradle.kts
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "73"

  release-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FL_RELEASE_KEYSTORE_B64: ${{ secrets.FL_RELEASE_KEYSTORE_B64 }}
      FL_RELEASE_STORE_PASSWORD: ${{ secrets.FL_RELEASE_STORE_PASSWORD }}
      FL_RELEASE_KEY_ALIAS: ${{ secrets.FL_RELEASE_KEY_ALIAS }}
      FL_RELEASE_KEY_PASSWORD: ${{ secrets.FL_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Require stable release signing
        shell: bash
        run: |
          test -n "$FL_RELEASE_KEYSTORE_B64" || { echo "Stable release signing is not configured; debug CI artifact remains available."; exit 1; }
          test -n "$FL_RELEASE_STORE_PASSWORD" || { echo "Missing FL_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$FL_RELEASE_KEY_ALIAS" || { echo "Missing FL_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$FL_RELEASE_KEY_PASSWORD" || { echo "Missing FL_RELEASE_KEY_PASSWORD"; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Materialize stable release keystore
        run: |
          mkdir -p "$RUNNER_TEMP/flashlearn"
          echo "$FL_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/flashlearn/release.keystore"
          test -s "$RUNNER_TEMP/flashlearn/release.keystore"
      - name: Build signed current release
        env:
          FL_RELEASE_STORE_FILE: ${{ runner.temp }}/flashlearn/release.keystore
        run: gradle --no-daemon clean assembleRelease
      - name: Verify current release signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Verify current release version
        run: |
          test "$(apkanalyzer manifest version-code app/build/outputs/apk/release/app-release.apk)" = "${FL_VERSION_CODE}"
      - name: Real signed update-path smoke test
        env:
          FL_RELEASE_STORE_FILE: ${{ runner.temp }}/flashlearn/release.keystore
        shell: bash
        run: |
          set -euo pipefail
          cp app/build.gradle.kts "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}"
          trap 'cp "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}" app/build.gradle.kts' EXIT
          sed -i 's/versionCode = 73/versionCode = 72/; s/versionName = "5.73"/versionName = "5.72"/' app/build.gradle.kts
          gradle --no-daemon :app:assembleRelease
          OLD_APK=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$OLD_APK"
          adb install "$OLD_APK"
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "72"
          sed -i 's/versionCode = 72/versionCode = 73/; s/versionName = "5.72"/versionName = "5.73"/' app/build.gradle.kts
          gradle --no-daemon :app:assembleRelease
          NEW_APK=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$NEW_APK"
          adb install -r "$NEW_APK"
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "73"
      - name: Stage signed release artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FlashLearn_v${FL_VERSION_NAME}_RELEASE.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-release-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_RELEASE.apk
          if-no-files-found: error
