name: FlashLearn Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FL_VERSION_NAME: "5.87"
  FL_VERSION_CODE: "87"
  FL_PREVIOUS_VERSION_NAME: "5.86"
  FL_PREVIOUS_VERSION_CODE: "86"

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          command -v adb
          command -v apksigner
          command -v apkanalyzer
      - name: Create clean CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore
          rm -f keystore/debug.keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass androiddebugkey \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          keytool -list -keystore keystore/debug.keystore -storepass android -keypass androiddebugkey -alias androiddebugkey >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify debug APK signature
        run: apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Verify debug APK version
        run: test "$(apkanalyzer manifest version-code app/build/outputs/apk/debug/app-debug.apk)" = "${FL_VERSION_CODE}"
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlashLearn_v${FL_VERSION_NAME}_DEBUG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-debug-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_DEBUG.apk
          if-no-files-found: error
      - name: Stage exact source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/FlashLearn_v${FL_VERSION_NAME}_SOURCE.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-source
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_SOURCE.zip
          if-no-files-found: error

  instrumentation-tests:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          command -v adb
          command -v apksigner
          command -v apkanalyzer
      - name: Create clean CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore
          rm -f keystore/debug.keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass androiddebugkey \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          keytool -list -keystore keystore/debug.keystore -storepass android -keypass androiddebugkey -alias androiddebugkey >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare instrumentation test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/flashlearn-instrumentation.sh" <<'BASH_SCRIPT'
          set -euo pipefail
          gradle --no-daemon connectedDebugAndroidTest
          rm -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build.gradle.kts "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}"
          trap 'cp "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}" app/build.gradle.kts' EXIT
          sed -i "s/versionCode = ${FL_VERSION_CODE}/versionCode = ${FL_PREVIOUS_VERSION_CODE}/; s/versionName = \"${FL_VERSION_NAME}\"/versionName = \"${FL_PREVIOUS_VERSION_NAME}\"/" app/build.gradle.kts
          gradle --no-daemon :app:assembleDebug
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest:' | tr -d '\r' > "$RUNNER_TEMP/flashlearn-old-cert"
          test -s "$RUNNER_TEMP/flashlearn-old-cert"
          adb install app/build/outputs/apk/debug/app-debug.apk
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "${FL_PREVIOUS_VERSION_CODE}"
          sed -i "s/versionCode = ${FL_PREVIOUS_VERSION_CODE}/versionCode = ${FL_VERSION_CODE}/; s/versionName = \"${FL_PREVIOUS_VERSION_NAME}\"/versionName = \"${FL_VERSION_NAME}\"/" app/build.gradle.kts
          gradle --no-daemon :app:assembleDebug
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test "$(cat "$RUNNER_TEMP/flashlearn-old-cert")" = "$(apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest:' | tr -d '\r')"
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "${FL_VERSION_CODE}"
          BASH_SCRIPT
          chmod 700 "$RUNNER_TEMP/flashlearn-instrumentation.sh"
      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot"
          disable-animations: true
          force-avd-creation: true
          script: bash "$RUNNER_TEMP/flashlearn-instrumentation.sh"

  release-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FL_RELEASE_KEYSTORE_B64: ${{ secrets.FL_RELEASE_KEYSTORE_B64 }}
      FL_RELEASE_STORE_PASSWORD: ${{ secrets.FL_RELEASE_STORE_PASSWORD }}
      FL_RELEASE_KEY_ALIAS: ${{ secrets.FL_RELEASE_KEY_ALIAS }}
      FL_RELEASE_KEY_PASSWORD: ${{ secrets.FL_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check stable release signing configuration
        id: release_signing
        shell: bash
        run: |
          if [[ -n "$FL_RELEASE_KEYSTORE_B64" && -n "$FL_RELEASE_STORE_PASSWORD" && -n "$FL_RELEASE_KEY_ALIAS" && -n "$FL_RELEASE_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is not configured; skipping signed release gate. Debug CI remains the required artifact."
          fi
      - uses: actions/setup-java@v5
        if: steps.release_signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release_signing.outputs.configured == 'true'
        with:
          gradle-version: "8.2"
      - name: Install Android SDK tools
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          command -v adb
          command -v apksigner
          command -v apkanalyzer
      - name: Materialize stable release keystore
        if: steps.release_signing.outputs.configured == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/flashlearn"
          echo "$FL_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/flashlearn/release.keystore"
          test -s "$RUNNER_TEMP/flashlearn/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/flashlearn/release.keystore" -storepass "$FL_RELEASE_STORE_PASSWORD" -alias "$FL_RELEASE_KEY_ALIAS" >/dev/null
      - name: Build signed current release
        if: steps.release_signing.outputs.configured == 'true'
        env:
          FL_RELEASE_STORE_FILE: ${{ runner.temp }}/flashlearn/release.keystore
        run: gradle --no-daemon clean assembleRelease
      - name: Verify current release signature
        if: steps.release_signing.outputs.configured == 'true'
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Verify current release version
        if: steps.release_signing.outputs.configured == 'true'
        run: test "$(apkanalyzer manifest version-code app/build/outputs/apk/release/app-release.apk)" = "${FL_VERSION_CODE}"
      - name: Real signed update-path smoke test
        if: steps.release_signing.outputs.configured == 'true'
        env:
          FL_RELEASE_STORE_FILE: ${{ runner.temp }}/flashlearn/release.keystore
        shell: bash
        run: |
          set -euo pipefail
          cp app/build.gradle.kts "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}"
          trap 'cp "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}" app/build.gradle.kts' EXIT
          sed -i "s/versionCode = ${FL_VERSION_CODE}/versionCode = ${FL_PREVIOUS_VERSION_CODE}/; s/versionName = \"${FL_VERSION_NAME}\"/versionName = \"${FL_PREVIOUS_VERSION_NAME}\"/" app/build.gradle.kts
          gradle --no-daemon :app:assembleRelease
          OLD_APK=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$OLD_APK"
          test "$(apkanalyzer manifest version-code "$OLD_APK")" = "${FL_PREVIOUS_VERSION_CODE}"
          adb install "$OLD_APK"
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "${FL_PREVIOUS_VERSION_CODE}"
          sed -i "s/versionCode = ${FL_PREVIOUS_VERSION_CODE}/versionCode = ${FL_VERSION_CODE}/; s/versionName = \"${FL_PREVIOUS_VERSION_NAME}\"/versionName = \"${FL_VERSION_NAME}\"/" app/build.gradle.kts
          gradle --no-daemon :app:assembleRelease
          NEW_APK=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$NEW_APK"
          test "$(apkanalyzer manifest version-code "$NEW_APK")" = "${FL_VERSION_CODE}"
          adb install -r "$NEW_APK"
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "${FL_VERSION_CODE}"
      - name: Stage signed release artifact
        if: steps.release_signing.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FlashLearn_v${FL_VERSION_NAME}_RELEASE.apk"
      - uses: actions/upload-artifact@v4
        if: steps.release_signing.outputs.configured == 'true'
        with:
          name: flashlearn-release-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_RELEASE.apk
          if-no-files-found: error

  final-ci-gate:
    if: always()
    needs:
      - build-and-unit-test
      - instrumentation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require build, unit, and instrumentation success
        shell: bash
        run: |
          set -euo pipefail
          echo "build-and-unit-test=${{ needs.build-and-unit-test.result }}"
          echo "instrumentation-tests=${{ needs.instrumentation-tests.result }}"
          test "${{ needs.build-and-unit-test.result }}" = "success"
          test "${{ needs.instrumentation-tests.result }}" = "success"
          echo "Final CI gate: PASS"
