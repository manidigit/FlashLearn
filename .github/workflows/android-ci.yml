name: FlashLearn Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flashlearn-android-ci
  cancel-in-progress: true

env:
  FL_VERSION_NAME: "5.93"
  FL_VERSION_CODE: "93"
  FL_PREVIOUS_VERSION_NAME: "5.92"
  FL_PREVIOUS_VERSION_CODE: "92"

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
          command -v adb
          command -v apksigner
          command -v aapt
      - name: Restore stable CI debug keystore cache
        uses: actions/cache@v4
        with:
          path: keystore/debug.keystore
          key: flashlearn-debug-keystore-v3
      - name: Materialize stable CI debug keystore
        shell: bash
        env:
          FL_DEBUG_KEYSTORE_B64: ${{ secrets.FL_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          valid_key=false
          validate_private_key() {
            local source="$1"
            local probe="$RUNNER_TEMP/flashlearn-keystore-probe.jks"
            rm -f "$probe"
            keytool -importkeystore -srckeystore "$source" -srcstoretype JKS -srcstorepass android -srcalias androiddebugkey -srckeypass androiddebugkey -destkeystore "$probe" -deststoretype JKS -deststorepass android -destalias androiddebugkey -destkeypass androiddebugkey -noprompt >/dev/null 2>&1
            rm -f "$probe"
          }
          if [[ -n "$FL_DEBUG_KEYSTORE_B64" ]]; then
            echo "$FL_DEBUG_KEYSTORE_B64" | base64 --decode > keystore/debug.keystore
            if validate_private_key keystore/debug.keystore; then
              echo "Using repository-configured stable debug signing key."
              valid_key=true
            else
              echo "Configured debug signing key is invalid; replacing it with a fresh CI key."
              rm -f keystore/debug.keystore
            fi
          fi
          if [[ "$valid_key" != true && -s keystore/debug.keystore ]] && validate_private_key keystore/debug.keystore; then
            echo "Using cached stable CI debug signing key."
            valid_key=true
          fi
          if [[ "$valid_key" != true ]]; then
            rm -f keystore/debug.keystore
            echo "Creating a new initial CI debug signing key to seed the cache."
            keytool -genkeypair -v -keystore keystore/debug.keystore -storetype JKS -storepass android -keypass androiddebugkey -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          validate_private_key keystore/debug.keystore
          keytool -list -keystore keystore/debug.keystore -storetype JKS -storepass android -alias androiddebugkey >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify debug APK signature
        run: apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Verify debug APK version
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ACTUAL_VERSION_CODE="$(aapt dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$ACTUAL_VERSION_CODE" = "${FL_VERSION_CODE}"
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlashLearn_v${FL_VERSION_NAME}_DEBUG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-debug-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_DEBUG.apk
          if-no-files-found: error
      - name: Stage exact source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/FlashLearn_v${FL_VERSION_NAME}_SOURCE.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-source
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_SOURCE.zip
          if-no-files-found: error

  instrumentation-tests:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - name: Restore stable CI debug keystore cache
        uses: actions/cache@v4
        with:
          path: keystore/debug.keystore
          key: flashlearn-debug-keystore-v3
      - name: Materialize stable CI debug keystore
        shell: bash
        env:
          FL_DEBUG_KEYSTORE_B64: ${{ secrets.FL_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          valid_key=false
          validate_private_key() {
            local source="$1"
            local probe="$RUNNER_TEMP/flashlearn-keystore-probe.jks"
            rm -f "$probe"
            keytool -importkeystore -srckeystore "$source" -srcstoretype JKS -srcstorepass android -srcalias androiddebugkey -srckeypass androiddebugkey -destkeystore "$probe" -deststoretype JKS -deststorepass android -destalias androiddebugkey -destkeypass androiddebugkey -noprompt >/dev/null 2>&1
            rm -f "$probe"
          }
          if [[ -n "$FL_DEBUG_KEYSTORE_B64" ]]; then
            echo "$FL_DEBUG_KEYSTORE_B64" | base64 --decode > keystore/debug.keystore
            if validate_private_key keystore/debug.keystore; then
              echo "Using repository-configured stable debug signing key."
              valid_key=true
            else
              echo "Configured debug signing key is invalid; replacing it with a fresh CI key."
              rm -f keystore/debug.keystore
            fi
          fi
          if [[ "$valid_key" != true && -s keystore/debug.keystore ]] && validate_private_key keystore/debug.keystore; then
            echo "Using cached stable CI debug signing key."
            valid_key=true
          fi
          if [[ "$valid_key" != true ]]; then
            rm -f keystore/debug.keystore
            echo "Creating a new initial CI debug signing key to seed the cache."
            keytool -genkeypair -v -keystore keystore/debug.keystore -storetype JKS -storepass android -keypass androiddebugkey -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          validate_private_key keystore/debug.keystore
          keytool -list -keystore keystore/debug.keystore -storetype JKS -storepass android -alias androiddebugkey >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare instrumentation test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/flashlearn-instrumentation.sh" <<'BASH_SCRIPT'
          set -euo pipefail
          gradle --no-daemon connectedDebugAndroidTest
          rm -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build.gradle.kts "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}"
          trap 'cp "$RUNNER_TEMP/build.gradle.kts.v${FL_VERSION_CODE}" app/build.gradle.kts' EXIT
          sed -i "s/versionCode = ${FL_VERSION_CODE}/versionCode = ${FL_PREVIOUS_VERSION_CODE}/; s/versionName = \"${FL_VERSION_NAME}\"/versionName = \"${FL_PREVIOUS_VERSION_NAME}\"/" app/build.gradle.kts
          gradle --no-daemon :app:assembleDebug
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest:' | tr -d '\r' > "$RUNNER_TEMP/flashlearn-old-cert"
          test -s "$RUNNER_TEMP/flashlearn-old-cert"
          adb install app/build/outputs/apk/debug/app-debug.apk
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "${FL_PREVIOUS_VERSION_CODE}"
          sed -i "s/versionCode = ${FL_PREVIOUS_VERSION_CODE}/versionCode = ${FL_VERSION_CODE}/; s/versionName = \"${FL_PREVIOUS_VERSION_NAME}\"/versionName = \"${FL_VERSION_NAME}\"/" app/build.gradle.kts
          gradle --no-daemon :app:assembleDebug
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test "$(cat "$RUNNER_TEMP/flashlearn-old-cert")" = "$(apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'Signer #1 certificate SHA-256 digest:' | tr -d '\r')"
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "${FL_VERSION_CODE}"
          BASH_SCRIPT
          chmod 700 "$RUNNER_TEMP/flashlearn-instrumentation.sh"
      - name: Run instrumentation tests
        run: "$RUNNER_TEMP/flashlearn-instrumentation.sh"
