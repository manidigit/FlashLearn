name: FlashLearn Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Build
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlashLearn_v5.58_DEBUG.apk"
          git archive --format=zip --output="dist/FlashLearn_v5.58_SOURCE.zip" HEAD
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlearn-debug-apk
          path: dist/FlashLearn_v5.58_DEBUG.apk
          if-no-files-found: error
      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: flashlearn-source
          path: dist/FlashLearn_v5.58_SOURCE.zip
          if-no-files-found: error

  instrumentation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot"
          disable-animations: true
          force-avd-creation: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: warn
