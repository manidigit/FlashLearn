name: FlashLearn Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FL_VERSION_NAME: "5.70"
  FL_VERSION_CODE: "70"

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlashLearn_v${FL_VERSION_NAME}_DEBUG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-debug-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_DEBUG.apk
          if-no-files-found: error
      - name: Stage exact source archive
        run: |
          git archive --format=zip --output="dist/FlashLearn_v${FL_VERSION_NAME}_SOURCE.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: flashlearn-source
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_SOURCE.zip
          if-no-files-found: error

  instrumentation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot"
          disable-animations: true
          force-avd-creation: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            gradle --no-daemon :app:assembleDebug
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 - <<'PY'
            from pathlib import Path
            p = Path("app/build.gradle.kts")
            s = p.read_text()
            s = s.replace("versionCode = 70", "versionCode = 71").replace('versionName = "5.70"', 'versionName = "5.71"')
            p.write_text(s)
            PY
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            test "$(adb shell dumpsys package com.flashlearn.app | grep -m1 versionCode | tr -d '\r' | grep -o 'versionCode=[0-9]*' | cut -d= -f2)" = "71"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: warn

  release-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FL_RELEASE_KEYSTORE_B64: ${{ secrets.FL_RELEASE_KEYSTORE_B64 }}
      FL_RELEASE_STORE_PASSWORD: ${{ secrets.FL_RELEASE_STORE_PASSWORD }}
      FL_RELEASE_KEY_ALIAS: ${{ secrets.FL_RELEASE_KEY_ALIAS }}
      FL_RELEASE_KEY_PASSWORD: ${{ secrets.FL_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check release signing availability
        id: signing
        shell: bash
        run: |
          if [ -n "$FL_RELEASE_KEYSTORE_B64" ] && [ -n "$FL_RELEASE_STORE_PASSWORD" ] && [ -n "$FL_RELEASE_KEY_ALIAS" ] && [ -n "$FL_RELEASE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is not configured; release build is skipped."
          fi
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.available == 'true'
        with:
          gradle-version: "8.2"
      - name: Materialize release keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/flashlearn"
          echo "$FL_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/flashlearn/release.keystore"
          test -s "$RUNNER_TEMP/flashlearn/release.keystore"
      - name: Build signed release
        if: steps.signing.outputs.available == 'true'
        env:
          FL_RELEASE_STORE_FILE: ${{ runner.temp }}/flashlearn/release.keystore
        run: gradle --no-daemon clean assembleRelease
      - name: Verify release artifact
        if: steps.signing.outputs.available == 'true'
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify release signature
        if: steps.signing.outputs.available == 'true'
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Stage release artifact
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FlashLearn_v${FL_VERSION_NAME}_RELEASE.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: flashlearn-release-apk
          path: dist/FlashLearn_v${{ env.FL_VERSION_NAME }}_RELEASE.apk
          if-no-files-found: error
