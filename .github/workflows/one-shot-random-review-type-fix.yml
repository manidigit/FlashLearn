name: one-shot-random-review-type-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          target='data/src/main/java/com/flashlearn/data/backup/RoomBackupRepository.kt'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/src/main/java/com/flashlearn/data/backup/RoomBackupRepository.kt')
          s = p.read_text()
          old = 'private val REVIEW_TYPES = setOf("DAILY", "WEEKLY", "MONTHLY", "LEARNED")'
          new = 'private val REVIEW_TYPES = setOf("DAILY", "WEEKLY", "MONTHLY", "LEARNED", "RANDOM")'
          if old not in s:
              raise SystemExit('Expected REVIEW_TYPES declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/one-shot-random-review-type-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target" .github/workflows/one-shot-random-review-type-fix.yml
          git commit -m 'v5.86 fix RANDOM review type restore validation'
          git push
