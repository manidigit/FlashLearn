name: patch-review-ui
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[review-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ReviewScreen setup UI
        run: python3 tools/patch_review_ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/flashlearn/app/ui/review/ReviewScreen.kt
          git commit -m "Review screen match approved design [review-ui-patched]"
          git push
